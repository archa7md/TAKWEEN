<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAKWEEN | تكوين</title><style>:root{--ink:#292522;--gold:#b99a63;--bg:#f5f1ea;--card:#fff}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}header{padding:28px 6%;background:#292522;color:#fff}main{max-width:1100px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 12px #0001}label{display:block;margin:10px 0 5px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:8px}button{margin-top:15px;background:#292522;color:#fff;cursor:pointer}.result{white-space:pre-wrap;direction:ltr;text-align:left;max-height:600px;overflow:auto}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header><div style="max-width:1100px;margin:auto"><div style="font-size:13px;letter-spacing:2px;color:#d8c39b">ARCHITECTURE INTELLIGENCE</div><h1 style="margin:8px 0">TAKWEEN | تكوين</h1><p style="margin:0">From Brief to BIM — Saudi Villa Design Intelligence</p></div></header><main><div class="grid"><section class="card"><h2>مشروع جديد</h2><label>وصف المشروع</label><textarea id="brief" rows="8">فيلا دورين، 5 غرف نوم، مجلس ضيوف، صالة عائلية، مطبخ، سفرة، 2 مواقف</textarea><label>عرض الأرض بالمتر</label><input id="w" type="number" value="20"><label>عمق الأرض بالمتر</label><input id="d" type="number" value="30"><label>اتجاه الشمال بالدرجات</label><input id="n" type="number" value="0"><button onclick="run()">توليد وتحليل التصميم</button></section><section class="card"><h2>النتيجة</h2><div id="status" style="padding:10px;background:#f4efe7;border-radius:8px">جاهز</div><div id="summary" style="margin-top:14px"></div><details style="margin-top:14px"><summary>بيانات النظام</summary><pre id="result" class="result"></pre></details></section></div></main><script>async function run(){const status=document.getElementById('status'),out=document.getElementById('result');status.textContent='جاري التحليل...';out.textContent='';try{const r=await fetch('/projects/final-pipeline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brief_text:document.getElementById('brief').value,count:8,site:{width_m:+document.getElementById('w').value,depth_m:+document.getElementById('d').value,north_deg:+document.getElementById('n').value}})});const j=await r.json();status.textContent=r.ok?'اكتمل — جاهز للمراجعة المعمارية':'خطأ';out.textContent=JSON.stringify(j,null,2); renderSummary(j)}catch(e){status.textContent='تعذر الاتصال بالـAPI';out.textContent=e} }
function renderSummary(j){const x=j.final||j.result||j; const arr=x.alternatives||x.concepts||x.generated||[]; document.getElementById('summary').innerHTML='<div class="grid">'+(Array.isArray(arr)?arr.slice(0,6).map((a,i)=>'<div class="card"><b>Concept '+(i+1)+'</b><br>Score: '+(a.score??a.unified_score??'—')+'</div>').join(''):'')+'</div>'}}</script></body></html>
